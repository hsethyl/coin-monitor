<script>
// Pine ta.* 함수의 JS 이식. 입력은 배열(0번이 가장 오래된 봉), NaN = Pine의 na.
(function (root) {
  const isn = Number.isNaN, NA = NaN, nz = x => (isn(x) ? 0 : x);
  const fill = (n, v = NA) => Array(n).fill(v);
  const ago = (a, k = 1) => a.map((_, i) => (i - k >= 0 ? a[i - k] : NA)); // Pine의 a[k]

  function sma(a, n) {
    const o = fill(a.length); let s = 0, bad = 0;
    for (let i = 0; i < a.length; i++) {
      if (isn(a[i])) bad++; else s += a[i];
      if (i >= n) { if (isn(a[i - n])) bad--; else s -= a[i - n]; }
      if (i >= n - 1 && !bad) o[i] = s / n;
    }
    return o;
  }
  // ema/rma: 첫 값은 sma로 시작(Pine과 동일), 이후 재귀
  function recur(a, n, k) {
    const o = fill(a.length), seed = sma(a, n); let prev = NA;
    for (let i = 0; i < a.length; i++) {
      if (isn(prev)) { if (!isn(seed[i])) prev = o[i] = seed[i]; }
      else if (isn(a[i])) o[i] = NA;
      else prev = o[i] = k * a[i] + (1 - k) * prev;
    }
    return o;
  }
  const ema = (a, n) => recur(a, n, 2 / (n + 1));
  const rma = (a, n) => recur(a, n, 1 / n);

  function win(a, n, f) { // 직전 n개(현재 포함) 창에 f 적용, NaN 있으면 NaN
    const o = fill(a.length);
    for (let i = n - 1; i < a.length; i++) {
      let ok = true; for (let j = i - n + 1; j <= i; j++) if (isn(a[j])) { ok = false; break; }
      if (ok) o[i] = f(a, i - n + 1, i);
    }
    return o;
  }
  const highest = (a, n) => win(a, n, (x, s, e) => { let m = -Infinity; for (let j = s; j <= e; j++) if (x[j] > m) m = x[j]; return m; });
  const lowest = (a, n) => win(a, n, (x, s, e) => { let m = Infinity; for (let j = s; j <= e; j++) if (x[j] < m) m = x[j]; return m; });
  const variance = (a, n) => win(a, n, (x, s, e) => { let m = 0; for (let j = s; j <= e; j++) m += x[j]; m /= n; let v = 0; for (let j = s; j <= e; j++) v += (x[j] - m) ** 2; return v / n; });
  const stdev = (a, n) => variance(a, n).map(Math.sqrt);
  const sum = (a, n) => sma(a, n).map(x => x * n);
  const change = (a, k = 1) => a.map((x, i) => (i >= k ? x - a[i - k] : NA));
  const cum = a => { let s = 0; return a.map(x => (s += nz(x))); };
  const map2 = (a, b, f) => a.map((x, i) => f(x, b[i]));

  function percentrank(a, n) { // 직전 n개 중 현재값 이하인 비율(%)
    const o = fill(a.length);
    for (let i = n; i < a.length; i++) {
      let c = 0; for (let j = i - n; j < i; j++) if (a[j] <= a[i]) c++;
      o[i] = (c / n) * 100;
    }
    return o;
  }
  function percentile(a, n, p) { // nearest rank, NaN은 무시
    const o = fill(a.length);
    for (let i = n - 1; i < a.length; i++) {
      const w = []; for (let j = i - n + 1; j <= i; j++) if (!isn(a[j])) w.push(a[j]);
      if (!w.length) continue;
      w.sort((x, y) => x - y);
      o[i] = w[Math.min(w.length - 1, Math.max(0, Math.ceil((p / 100) * w.length) - 1))];
    }
    return o;
  }
  // 피벗: i번째 값 = (i-R)번 봉이 피벗이면 그 값, 아니면 NaN (Pine ta.pivotlow/high와 같은 위치 규약)
  function pivot(a, L, R, low) {
    const o = fill(a.length);
    for (let i = L + R; i < a.length; i++) {
      const c = i - R; let ok = !isn(a[c]);
      for (let j = c - L; ok && j <= c + R; j++) {
        if (j === c) continue;
        if (isn(a[j])) ok = false;
        else if (j < c) ok = low ? a[j] >= a[c] : a[j] <= a[c];
        else ok = low ? a[j] > a[c] : a[j] < a[c];
      }
      if (ok) o[i] = a[c];
    }
    return o;
  }
  const pivotlow = (a, L, R) => pivot(a, L, R, true);
  const pivothigh = (a, L, R) => pivot(a, L, R, false);

  const tr = (h, l, c) => h.map((x, i) => (i ? Math.max(x - l[i], Math.abs(x - c[i - 1]), Math.abs(l[i] - c[i - 1])) : x - l[i]));
  const atr = (h, l, c, n) => rma(tr(h, l, c), n);
  function rsi(c, n) {
    const ch = change(c), up = rma(ch.map(x => (isn(x) ? NA : Math.max(x, 0))), n), dn = rma(ch.map(x => (isn(x) ? NA : Math.max(-x, 0))), n);
    return up.map((u, i) => (isn(u) || isn(dn[i]) ? NA : dn[i] === 0 ? 100 : 100 - 100 / (1 + u / dn[i])));
  }
  function dmi(h, l, c, n, sm) {
    const up = change(h), dn = change(l).map(x => -x);
    const pdm = up.map((u, i) => (u > dn[i] && u > 0 ? u : 0)), mdm = up.map((u, i) => (dn[i] > u && dn[i] > 0 ? dn[i] : 0));
    pdm[0] = mdm[0] = NA;
    const t = rma(tr(h, l, c), n), plus = rma(pdm, n).map((x, i) => (100 * x) / t[i]), minus = rma(mdm, n).map((x, i) => (100 * x) / t[i]);
    const adx = rma(plus.map((p, i) => { const s = p + minus[i]; return Math.abs(p - minus[i]) / (s === 0 ? 1 : s); }), sm).map(x => 100 * x);
    return { plus, minus, adx };
  }
  function bb(c, n, m) {
    const mid = sma(c, n), sd = stdev(c, n);
    return { mid, up: mid.map((x, i) => x + m * sd[i]), lo: mid.map((x, i) => x - m * sd[i]) };
  }
  const obv = (c, v) => cum(change(c).map((x, i) => Math.sign(nz(x)) * v[i]));
  const crossover = (a, b) => a.map((x, i) => i > 0 && x > (b[i] ?? b) && a[i - 1] <= (b[i - 1] ?? b));
  const crossunder = (a, b) => a.map((x, i) => i > 0 && x < (b[i] ?? b) && a[i - 1] >= (b[i - 1] ?? b));

  root.TA = { NA, isn, nz, fill, ago, sma, ema, rma, highest, lowest, variance, stdev, sum, change, cum, map2, percentrank, percentile, pivotlow, pivothigh, tr, atr, rsi, dmi, bb, obv, crossover, crossunder };
  if (typeof module !== 'undefined') module.exports = root.TA;
})(typeof window !== 'undefined' ? window : globalThis);

</script>
<script>
// TradingView(Pine)로 만든 지표 11종을 JS로 이식. 입력 B={t,o,h,l,c,v}(배열, 오래된 봉부터), 마지막 봉은 미마감.
// 출력 {pane, lines, hist, markers, bg, hlines, rows} — 그리기는 position_monitor.html이 담당.
(function (root) {
  const T = root.TA || require('./pm_ta.js');
  const { NA, isn, nz, fill, ago, sma, ema, highest, lowest, stdev, variance, change, sum, cum, percentrank, percentile, atr, rsi, dmi, bb, obv, crossover, crossunder } = T;
  const rgba = (r, g, b, a) => `rgba(${r},${g},${b},${a})`;
  const C = { green: '#26a69a', red: '#ef5350', lime: '#00e676', aqua: '#00bcd4', orange: '#ff9800', blue: '#2962ff', white: '#d1d4dc', gray: '#787b86', yellow: '#fdd835', fuchsia: '#e040fb', teal: '#089981', purple: '#9c27b0', maroon: '#a52a4a' };
  const BG = { green: rgba(38, 166, 154, .12), red: rgba(239, 83, 80, .12), blue: rgba(41, 98, 255, .12), yellow: rgba(253, 216, 53, .14), gray: rgba(120, 123, 134, .14) };
  const f = (x, d = 2) => (x == null || isn(x) ? '-' : Number(x).toLocaleString('en-US', { maximumFractionDigits: d }));
  const L = a => a[a.length - 1];
  const sgn = x => (x > 0 ? 'up' : x < 0 ? 'dn' : '');
  const conf = (B, i) => i < B.c.length - 1; // barstate.isconfirmed (마지막 봉은 미확정)
  const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
  const midOf = (B, n) => { const hi = highest(B.h, n), lo = lowest(B.l, n); return hi.map((x, i) => (x + lo[i]) / 2); };
  // 같은 길이의 선에서 조건이 참인 곳만 값을 남긴다(plot의 na 처리)
  const only = (cond, a) => a.map((x, i) => (cond[i] ? x : NA));
  const marks = (B, cond, pos, shape, color, text) => cond.map((x, i) => (x ? { i, pos, shape, color, text } : null)).filter(Boolean);

  // Donchian 한 기간의 보유 상태(진입: 종가>직전 n봉 고점, 청산: 종가<채널 중간값)
  function donch(B, n, midExit = true) {
    const up = ago(highest(B.h, n), 1), lo = ago(lowest(B.l, n), 1); let pos = 0;
    const st = B.c.map((c, i) => { if (!isn(up[i])) { if (c > up[i]) pos = 1; else if (pos === 1 && c < (up[i] + lo[i]) / 2) pos = 0; } return pos; });
    return { pos: st, up, mid: up.map((u, i) => (u + lo[i]) / 2) };
  }
  function weights(B, ns, volTarget, volLen, barsYear) {
    const ds = ns.map(n => donch(B, n)), frac = B.c.map((_, i) => ds.reduce((s, d) => s + d.pos[i], 0) / ns.length);
    const ret = change(B.c).map((x, i) => x / B.c[i - 1]), vol = stdev(ret, volLen).map(x => x * Math.sqrt(barsYear));
    const scale = vol.map(x => (isn(x) || x <= 0 ? 0 : Math.min(1, volTarget / x)));
    return { ds, frac, scale };
  }

  // ───────── 1. Smart OBV (보조창) ─────────
  function smartObv(B) {
    const n = B.c.length, R = 1, lb = 5, ob = obv(B.c, B.v), e1 = ema(ob, 1), e20 = ema(ob, 20), osc = e1.map((x, i) => x - e20[i]);
    const pl = T.pivotlow(osc, lb, R).map(x => !isn(x)), ph = T.pivothigh(osc, lb, R).map(x => !isn(x));
    const segs = (found, bull) => {
      const d = fill(n); let prev = -1;
      for (let i = 0; i < n; i++) {
        if (!found[i]) continue;
        if (prev >= 0) {
          const ci = i - R, cp = prev - R, bars = i - prev - 1;
          const okOsc = bull ? osc[ci] > osc[cp] : osc[ci] < osc[cp], okPx = bull ? B.l[ci] < B.l[cp] : B.h[ci] > B.h[cp];
          if (bars >= 2 && bars <= 100 && okOsc && okPx) { d[cp] = osc[cp]; d[ci] = osc[ci]; }
        }
        prev = i;
      }
      return d;
    };
    return {
      pane: 'sub',
      hist: [{ name: 'OBV Oscillator', data: osc, colors: osc.map(x => (x > 0 ? rgba(8, 153, 129, .7) : rgba(255, 152, 0, .7))) }],
      lines: [{ name: 'OBV line', data: osc, color: C.white, width: 1 }, { name: 'Bullish', data: segs(pl, true), color: C.lime, width: 2 }, { name: 'Bearish', data: segs(ph, false), color: C.red, width: 2 }],
      hlines: [{ price: 0, color: C.gray }], markers: [], bg: [],
      rows: [['OBV 오실레이터', f(L(osc), 0), sgn(L(osc))], ['다이버전스', '초록선=상승, 빨간선=하락 (표준 다이버전스, 기본 설정)', '']],
    };
  }

  // ───────── 2. Regime Switch + 일목 필터 (메인) ─────────
  function regime(B) {
    const { c, h, l } = B, n = c.length, d = dmi(h, l, c, 14, 14), trs = T.tr(h, l, c);
    const hh14 = highest(h, 14), ll14 = lowest(l, 14), chop = sum(trs, 14).map((s, i) => (100 * Math.log10(s / (hh14[i] - ll14[i]))) / Math.log10(14));
    const bands = bb(c, 20, 2), bbw = bands.up.map((u, i) => (u - bands.lo[i]) / bands.mid[i]), bbwRank = percentrank(bbw, 120);
    const sumAbs = sum(change(c).map(Math.abs), 10), er = c.map((x, i) => (i >= 10 ? Math.abs(x - c[i - 10]) / sumAbs[i] : NA));
    let vA = 0, vC = 0, vE = 0;
    const score = [], reg = c.map((_, i) => {
      if (d.adx[i] >= 25) vA = 1; else if (d.adx[i] < 20) vA = 0;
      if (chop[i] <= 38.2) vC = 1; else if (chop[i] >= 61.8) vC = 0;
      if (er[i] >= 0.6) vE = 1; else if (er[i] < 0.3) vE = 0;
      const vB = bbwRank[i] > 20 && bbw[i] > bbw[i - 3] ? 1 : 0, s = vA + vC + vB + vE;
      score.push(s); return s >= 3 ? 1 : s <= 1 ? -1 : 0;
    });
    const e20 = ema(c, 20), e50 = ema(c, 50), e200 = ema(c, 200), rs = rsi(c, 14), at = atr(h, l, c, 14);
    const up = c.map((_, i) => e20[i] > e50[i] && e50[i] > e200[i]), dn = c.map((_, i) => e20[i] < e50[i] && e50[i] < e200[i]);
    const lp = c.map((x, i) => reg[i] === 1 && up[i] && l[i] <= e20[i] && x > e20[i] && rs[i] < 60);
    const sp = c.map((x, i) => reg[i] === 1 && dn[i] && h[i] >= e20[i] && x < e20[i] && rs[i] > 40 && rs[i] < 62);
    const lm = c.map((x, i) => reg[i] === -1 && c[i - 1] < bands.lo[i - 1] && x > bands.lo[i] && rs[i] < 40);
    const sm = c.map((x, i) => reg[i] === -1 && c[i - 1] > bands.up[i - 1] && x < bands.up[i] && rs[i] > 60);
    const w = weights(B, [20, 40, 60, 90, 120, 180], 0.5, 30, 365);
    const ten = midOf(B, 9), kij = midOf(B, 26), spA = ten.map((x, i) => (x + kij[i]) / 2), spB = midOf(B, 52);
    const gate = reg.map(r => (r === -1 ? 0 : 1)), ichiOk = ten.map((x, i) => x > kij[i]);
    const target = c.map((_, i) => w.frac[i] * w.scale[i] * gate[i] * (ichiOk[i] ? 1 : 0));
    const i = n - 1, r = reg[i], stopM = r === -1 ? 1 : dn[i] ? 3 : 2.5;
    const txt = r === 1 ? (up[i] ? '상승 추세' : dn[i] ? '하락 추세' : '추세(방향 불명)') : r === -1 ? '횡보' : '전환 - 관망';
    return {
      pane: 'main',

      rows: [['방향', mom[i] === 2 ? '4H 상승정렬' : mom[i] === -2 ? '4H 하락정렬' : '4H 비정렬 (관망)', mom[i] === 2 ? 'up' : mom[i] === -2 ? 'dn' : ''], ['BTC 대비', f(rs[i] * 100, 2) + '%', sgn(rs[i])],
        ['최근 신호', lastS ? `${ls[lastS.i] ? 'LONG' : 'SHORT'} / ${nm(tier[lastS.i])} (${n - 1 - lastS.i}봉 전)` : '-'], ['최소 손절폭', '1.2% (왕복비용 0.12%×10)']],
    };

  // ───────── 10. 돈복사기 화살표 (메인) ─────────
  function donbok(B) {
    const { c, h, l } = B, n = c.length, e = ema(c, 200), at = atr(h, l, c, 14), dH = ago(highest(h, 20), 1), dL = ago(lowest(l, 20), 1), adx = dmi(h, l, c, 14, 14).adx;
    let pos = 0, sl = NA, tp = NA; const slA = [], tpA = [], ls = [], ss = [];
    c.forEach((x, i) => {
      const trending = adx[i] > 20, rL = pos === 0 && x > e[i] && trending && x > dH[i], rS = pos === 0 && x < e[i] && trending && x < dL[i];
      const lg = rL && conf(B, i), sg = rS && conf(B, i);
      if (lg) { pos = 1; sl = x - 1.5 * at[i]; tp = x + 3 * (x - sl); }
      if (sg) { pos = -1; sl = x + 1.5 * at[i]; tp = x - 3 * (sl - x); }
      const hit = (pos === 1 && (l[i] <= sl || h[i] >= tp)) || (pos === -1 && (h[i] >= sl || l[i] <= tp));
      if (hit && conf(B, i)) { pos = 0; sl = tp = NA; }
      ls.push(lg); ss.push(sg); slA.push(pos ? sl : NA); tpA.push(pos ? tp : NA);
    });

      pane: 'main', lines: [{ name: '추세 기준선 EMA200', data: e, color: C.green, width: 2, colors: e.map((x, k) => (c[k] > x ? C.green : C.red)) }, { name: '손절선', data: slA, color: C.red, width: 2 }, { name: '익절선', data: tpA, color: C.green, width: 2 }],
      bg: adx.map(a => (a > 20 ? null : BG.gray)), markers: [...marks(B, ls, 'below', 'arrowUp', C.green, '사자'), ...marks(B, ss, 'above', 'arrowDown', C.red, '팔자')],
      rows: [['상태', pos === 1 ? '롱 (신호 후 보유)' : pos === -1 ? '숏 (신호 후 보유)' : adx[i] > 20 ? '신호 대기' : '쉬는 구간 (ADX≤20)', pos === 1 ? 'up' : pos === -1 ? 'dn' : ''], ['손절 / 익절', pos ? `${f(sl, 6)} / ${f(tp, 6)}` : '-'], ['ADX', f(adx[i], 1)]],
    };
  }

  // ───────── 11. Donchian 앙상블 추세 (보조창) ─────────
  function donchEns(B) {
    const ns = [20, 40, 60, 90, 120, 180], w = weights(B, ns, 0.5, 30, 365), i = B.c.length - 1, weight = w.frac.map((x, k) => x * w.scale[k]);
    return {
      pane: 'sub', hist: [], markers: [], bg: [],
      lines: [{ name: 'Trend fraction', data: w.frac, color: C.teal, width: 2, type: 'area' }, { name: 'Target weight', data: weight, color: C.orange, width: 2 }],
      hlines: [{ price: 0.5, color: C.gray }],

    };
  }

  const LIST = [
    { id: 'obv', name: 'Smart OBV', pane: 'sub', run: smartObv },
    { id: 'regime', name: 'Regime Switch + 일목', pane: 'main', run: regime },

    { id: 'cvx', name: 'IF-Convex (4H 코인)', pane: 'main', run: convexCoin },
    { id: 'cvxkr', name: 'IF-Convex KR (일봉)', pane: 'main', run: convexKr },
    { id: 'tt', name: 'IF-TrendTrap', pane: 'main', needs: ['htf', 'btc'], run: trendTrap },

    { id: 'dens', name: 'Donchian 앙상블', pane: 'sub', run: donchEns },
  ];
  root.PMI = { LIST, run: (id, B, X = {}) => { const d = LIST.find(x => x.id === id); return { id, name: d.name, ...d.run(B, X) }; } };
  if (typeof module !== 'undefined') module.exports = root.PMI;
})(typeof window !== 'undefined' ? window : globalThis);

  const why=[],S=d.short;let s=0;
  const add=(n,t)=>{s+=n;why.push([n,t])},adv=S?'상승':'하락',wAdv=S?'순매수':'순매도',wFav=S?'순매도':'순매수',wall=S?'매수벽':'매도벽';
  if(d.liqGap<0.03)return{label:'정리 고려',cls:'r',s:-9,why:[[-9,'청산가까지 '+f(d.liqGap*100,1)+'% — 청산 임박']]};
  if(d.hit)return{label:'정리 고려',cls:'r',s:-9,why:[[-9,'일봉 추적손절선 이탈 ('+f(d.stop,4)+')']]};

  if(d.fund>0.0005&&d.chg5<0)add(-1,'펀딩 과열('+f(Math.abs(d.fund)*100,3)+'%) + '+adv+(S?' — 숏 스퀴즈 위험':' — 롱 청산 위험'));

  let bid=0,ask=0;dep.bids.forEach(([q,n])=>{if(+q>=px*.99)bid+=q*n});dep.asks.forEach(([q,n])=>{if(+q<=px*1.01)ask+=q*n});

    stop,atr,chg24:+tk.priceChangePercent,qv:+tk.quoteVolume});

  l.querySelectorAll('input').forEach(i=>i.checked=act.has(i.dataset.ind));c.querySelector('.ip summary').textContent=`지표 (${act.size})`})}

const closeChart=sym=>{const ch=charts[sym];if(ch){clearInd(ch);ch.chart.remove();delete charts[sym]}};
async function loadChart(sym){const c=card(sym),iv=c.querySelector('.iv').value;let ch=charts[sym];syncPickers();
  if(!ch){const chart=LightweightCharts.createChart(c.querySelector('.chart'),copt());
    ch=charts[sym]={chart,sym,iv,lines:[],ser:[],subs:[],X:{},sync:0,series:chart.addCandlestickSeries({upColor:cv('--g'),downColor:cv('--r'),borderVisible:false,wickUpColor:cv('--g'),wickDownColor:cv('--r')})};
    chart.timeScale().subscribeVisibleLogicalRangeChange(rg=>{const x=charts[sym];if(rg&&x&&!x.sync){x.sync=1;x.subs.forEach(s=>s.chart.timeScale().setVisibleLogicalRange(rg));x.sync=0}})}
  try{const k=await J(`/fapi/v1/klines?symbol=${sym}&interval=${iv}&limit=1500`);if(charts[sym]!==ch)return;
    ch.B=toBars(k);ch.iv=iv;ch.X={};ch.series.setData(candle(ch.B));const n=ch.B.t.length;ch.chart.timeScale().setVisibleLogicalRange({from:n-150,to:n+3});drawLines(sym);await applyInd(ch)}
  catch(_){$('st').textContent=sym+' 차트 불러오기 실패'}}
function drawLines(sym){const ch=charts[sym],p=pos.find(q=>q.sym===sym),s=st[sym];if(!ch||!p)return;
  ch.lines.forEach(l=>ch.series.removePriceLine(l));
  const L=p.lev||1,D=p.side==='short'?-1:1,liq=L>1?p.ep*(1-D/L+D*.005):0;
  ch.lines=[[p.ep,'#3b82f6','진입'],[s&&s.stop,'#f1c40f','손절선'],[liq,'#ff5a5f','청산']].filter(x=>x[0]>0&&isFinite(x[0]))
    .map(([price,color,title])=>ch.series.createPriceLine({price,color,title,lineWidth:1,lineStyle:2}))}
const putBar=(B,nb,j)=>{const last=B.t.length-1,at=nb.t[j]===B.t[last]?last:nb.t[j]>B.t[last]?last+1:-1;if(at>=0)['t','o','h','l','c','v'].forEach(k=>{B[k][at]=nb[k][j]})};
const updateCharts=()=>Promise.allSettled(Object.entries(charts).map(async([sym,ch])=>{
  const k=await J(`/fapi/v1/klines?symbol=${sym}&interval=${ch.iv}&limit=2`);if(charts[sym]!==ch||!ch.B)return;
  const nb=toBars(k);nb.t.forEach((_,j)=>{putBar(ch.B,nb,j);ch.series.update({time:nb.t[j],open:nb.o[j],high:nb.h[j],low:nb.l[j],close:nb.c[j]})});
  drawLines(sym);if(act.size)await applyInd(ch,false)}));
function toggle(sym,what){const u=ui[sym]??={};u[what]=!u[what];
  if(what==='chart'){card(sym).querySelector('.cw').hidden=!u.chart;if(u.chart)loadChart(sym);else closeChart(sym)}
  render()}
const ADV={r:'정리(일부 매도·손절)를 고려할 구간입니다. 청산가·손절선 이탈 여부부터 확인하세요.',y:'당장 정리 신호는 아니지만 위험 요인이 있습니다. 손절선을 미리 정해 두고 지켜보세요.',g:'특이 신호가 없어 규칙상 보유 유지입니다.'};

function render(){
  if(press)return;
  const out=$('out'),want=pos.map(p=>p.sym).join(),have=[...out.children].map(c=>c.dataset.sym).join();
  if(want!==have)out.replaceChildren(...pos.map(p=>card(p.sym)));
  $('empty').hidden=!!pos.length;
  const head=(p,right)=>`<div class="hd"><span class="sym" data-t="chart" title="클릭: 차트">${p.sym.replace('USDT','')}<span class="mut"> /USDT ${p.side==='spot'?'현물':p.side==='short'?'숏':'롱'}</span></span>${right}<button class="x" data-t="up" title="위로">▲</button><button class="x" data-t="down" title="아래로">▼</button><button class="x" data-t="edit" title="수정(진입가·방향·증거금·배율·진입일)">✎</button><button class="x" data-t="x" title="삭제">×</button></div>`;
  pos.forEach(p=>{
    const s=st[p.sym];let html;
    if(!s||s.px==null)html=head(p,'<span class="mut">불러오는 중…</span>');
    else{
      const L=p.lev||1,M=p.margin??p.qty*p.ep,w=whaleStats(s),S=p.side==='short',SP=p.side==='spot',D=S?-1:1,pnl=(s.px/p.ep-1)*100*L*D,
        liq=L>1?p.ep*(1-D/L+D*.005):(S?Infinity:0);
      const v=verdict({short:S,volX:s.volX,stop:s.stop,thr:+$('wt').value*3,whaleN:w.whaleN,whaleNet:w.whaleNet*D,chg5:s.chg5*D,imb:s.imb*D,fund:s.fund*D,
        liqGap:D*(s.px-liq)/s.px,hit:D*(s.px-s.stop)<=0,atrGap:D*(s.px-s.stop)/s.atr,liqBad:L>1&&D*(liq-s.stop)>0,btcOk:S?st.btcOk!==true:st.btcOk!==false});
      html=head(p,`<span class="pnl ${pnl>=0?'up':'dn'}">${pnl>=0?'+':''}${f(pnl)}% (${f(pnl/100*M,2)}$)</span><span class="v ${v.cls}" data-t="adv" title="클릭: 조언">${v.label}</span>`)+`
     <div class="grid">
      <div class="m"><span>${SP?'투입금 · 보유 수량':'배율 · 증거금 · 포지션 수량'}</span><b>${SP?'':L+'x · '}${f(M,2)}$ · ${f(M*L/p.ep,4)}개</b></div>
      <div class="m"><span>추정 청산가 (${SP?'현물':S?'숏':'롱'}, 격리 근사)</span><b class="${L>1&&D*(s.px-liq)/s.px<.1?'dn':''}">${L>1?f(liq,6)+' ('+f(Math.abs(s.px/liq-1)*100,1)+'% 여유)':(SP?'없음(현물)':'없음(1x)')}</b></div>
      <div class="m"><span>현재가 / 진입가</span><b>${f(s.px,6)} / ${f(p.ep,6)}</b></div>
      <div class="m"><span>일봉 추적손절선</span><b class="${D*(s.px-s.stop)/s.px<.03?'dn':''}">${f(s.stop,6)} (${f(D*(s.px-s.stop)/s.px*100,1)}% 여유)</b></div>
      <div class="m"><span>24h 변화 / 거래대금</span><b class="${s.chg24>=0?'up':'dn'}">${f(s.chg24)}% · ${f(s.qv/1e6,0)}M$</b></div>
      <div class="m"><span>실시간 거래량(5분, 평균 대비)</span><b class="${s.volX>=2?'dn':''}">${f(s.volX,1)}배</b></div>
      <div class="m"><span>고래 매수 / 매도 (1h, 관측분)</span><b><span class="up">${f(w.wb/1e3,0)}K</span> / <span class="dn">${f(w.ws/1e3,0)}K</span></b></div>
      <div class="m"><span>호가 ±1% 매수우위</span><b class="${s.imb>=0?'up':'dn'}">${f(s.imb*100,0)}%</b></div>
      <div class="m"><span>펀딩비</span><b>${f(s.fund*100,4)}%</b></div></div>`
      +(ui[p.sym]?.adv?`<div class="adv"><b>${v.label} — ${ADV[v.cls]}</b><ul>${v.why.length?v.why.map(([n,t])=>`<li class="${n>0?'up':'dn'}">${n>0?'▲':'▼'} ${t}</li>`).join(''):'<li class="mut">특이 신호 없음</li>'}</ul><div class="mut" style="margin-top:6px">참고용 신호이며 매매 권유가 아닙니다.</div></div>`:'')}
    const b=card(p.sym).firstChild;if(b._h!==html){b.innerHTML=html;b._h=html} // 바뀐 때만 갱신: 클릭이 렌더에 먹히지 않게
  })
}
async function tick(){
  const r=await Promise.allSettled([btc(),...pos.map(p=>refresh(p.sym,p))]);
  $('st').textContent=(r.some(x=>x.status==='rejected')?'⚠ 일부 데이터 실패 · ':'')+new Date().toLocaleTimeString();render();updateCharts();
}
$('f').onsubmit=async e=>{e.preventDefault();const fm=e.target,msg=t=>$('st').textContent=t;
  const raw=$('sy').value.trim().toUpperCase().replace(/USDT$/,'');
  if(!/^[A-Z0-9]{1,15}$/.test(raw))return msg('심볼은 영문/숫자 1~15자로 입력하세요');
  let sym=raw+'USDT',k=1;
  try{await J('/fapi/v1/ticker/price?symbol='+sym)}catch(_){ // SHIB·PEPE처럼 선물은 1000배 단위 심볼(1000SHIBUSDT)로 상장된 코인
    try{await J('/fapi/v1/ticker/price?symbol=1000'+sym);sym='1000'+sym;k=1000}catch(_){return msg(raw+'USDT는 바이낸스 선물에 없는 심볼입니다')}}
  if(pos.some(p=>p.sym===sym))return msg(sym+'는 이미 추가돼 있습니다');
  pos=[...pos,{sym,ep:+$('ep').value*k,side:$('sd').value,margin:+$('qt').value,lev:$('sd').value==='spot'?1:Math.min(125,Math.max(1,+$('lv').value||1)),date:$('ed').value||new Date().toISOString().slice(0,10)}];
  save('pm_pos',pos);fm.reset();$('lv').value=5;if(k>1)msg(sym+' 추가: 선물은 1000개 단위 가격이라 진입가를 ×1000으로 환산했습니다');connect();tick()};
$('out').onclick=e=>{const t=e.target.closest('[data-t]'),c=e.target.closest('.card');if(!t||!c)return;const sym=c.dataset.sym;
  if(t.dataset.t==='up'||t.dataset.t==='down'){const i=pos.findIndex(p=>p.sym===sym),j=i+(t.dataset.t==='up'?-1:1);
    if(j>=0&&j<pos.length){pos=pos.map((p,k)=>k===i?pos[j]:k===j?pos[i]:p);save('pm_pos',pos);render()}return}
  if(t.dataset.t==='edit'){const p=pos.find(q=>q.sym===sym),e=c.querySelector('.ed');
    c.querySelector('.e-ep').value=p.ep;c.querySelector('.e-sd').value=p.side;c.querySelector('.e-qt').value=p.margin??'';c.querySelector('.e-lv').value=p.lev||1;c.querySelector('.e-ed').value=p.date||'';
    c.querySelector('.e-note').textContent=sym.startsWith('1000')?'선물은 1000개 단위 가격입니다(진입가×1000)':'';e.hidden=!e.hidden;return}
  if(t.dataset.t==='cancel'){c.querySelector('.ed').hidden=true;return}
  if(t.dataset.t==='save'){const q=n=>c.querySelector('.e-'+n).value,ep=+q('ep'),margin=+q('qt'),side=q('sd');
    if(!(ep>0&&margin>0))return $('st').textContent='진입가와 증거금은 0보다 커야 합니다';
    pos=pos.map(p=>p.sym===sym?{...p,ep,side,margin,lev:side==='spot'?1:Math.min(125,Math.max(1,+q('lv')||1)),date:q('ed')||p.date}:p);
    save('pm_pos',pos);c.querySelector('.ed').hidden=true;drawLines(sym);render();return}
  if(t.dataset.t==='x'){pos=pos.filter(p=>p.sym!==sym);save('pm_pos',pos);closeChart(sym);cards.delete(sym);delete ui[sym];connect();render();return}
  toggle(sym,t.dataset.t)};
$('out').addEventListener('change',e=>{const el=e.target;
  if(el.classList.contains('iv'))return loadChart(el.closest('.card').dataset.sym);
  if(el.dataset.ind){const nx=new Set(act);nx.has(el.dataset.ind)?nx.delete(el.dataset.ind):nx.add(el.dataset.ind);act=nx;save('pm_ind',[...act]);syncPickers();
    Object.values(charts).forEach(ch=>applyInd(ch))}});
$('wt').onchange=()=>save('pm_wt',+$('wt').value);
connect();tick();setInterval(tick,5000);setInterval(render,1000);
</script></body></html>
